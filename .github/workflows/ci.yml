name: CI

# Feature branches are validated here; Vercel only deploys master (production)
# and development (preview). See vercel.json and docs/deployment.md.
on:
  pull_request:
    branches: [master, development]
  push:
    branches: [master, development]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Build only needs a syntactically valid URL; nothing connects to it.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
      NEXT_TELEMETRY_DISABLED: '1'
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      # shortcut: lints only changed files (same as the pre-commit hook) because the repo
      # still has ~29 legacy lint errors; switch to `npm run lint` once `npx eslint .` is clean.
      - name: Lint changed files
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "No usable base commit ($BASE); linting whole repo"; npm run lint; exit
          fi
          git diff --name-only --diff-filter=ACMR "$BASE"...HEAD -- '*.js' '*.mjs' '*.ts' '*.tsx' > changed.txt
          cat changed.txt
          if [ -s changed.txt ]; then
            xargs -a changed.txt npx eslint --max-warnings 0 --no-warn-ignored
          else
            echo "No JS/TS files changed"
          fi

      - name: Unit tests
        run: npx vitest run tests/unit

      - name: Build
        run: npm run build
